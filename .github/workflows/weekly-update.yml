name: Weekly major project update
on:
  schedule:
    # Sunday 21:00 UTC = Monday 06:00 KST (GitHub may delay scheduled runs)
    - cron: '0 21 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-major-project-update
  cancel-in-progress: false
jobs:
  update:
    # Enable only after both services use the same database and existing data is migrated.
    if: vars.WEEKLY_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python weekly_updates.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}

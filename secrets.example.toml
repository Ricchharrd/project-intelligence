# 이 파일을 secrets.toml로 복사하지 말고, 실제 값은 Streamlit Cloud의
# App settings > Secrets에 직접 입력하세요.

# 운영 배포에서는 Supabase 또는 Neon의 PostgreSQL 연결 문자열을 권장합니다.
DATABASE_URL = "postgresql+psycopg://USER:PASSWORD@HOST:5432/postgres?sslmode=require"
REQUIRE_DATABASE = "true"

# OpenAI API 연결 시에만 입력합니다. 키를 GitHub에 커밋하지 마세요.
OPENAI_API_KEY = "YOUR_OPENAI_API_KEY"
OPENAI_MODEL = "YOUR_RESPONSES_API_MODEL_ID"
